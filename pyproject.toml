[build-system]
requires = [
    "setuptools>=64",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "isage-rag-benchmark"
version = "0.1.0.2"
description = "RAG benchmarking suite for the SAGE ecosystem"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "IntelliStream Team", email = "shuhao_zhang@hust.edu.cn" },
]
keywords = [
    "sage",
    "benchmark",
    "rag",
    "retrieval-augmented-generation",
    "evaluation",
    "intellistream",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "isage-common",
    "isage-kernel",
    "isage-middleware>=0.2.4.0",
    "isage-libs",
    "sentence-transformers>=3.1.0,<4.0.0",
    "pyyaml>=6.0",
    "chromadb>=1.0.20",
    "pymilvus[model]>=2.4.0",
    "faiss-cpu>=1.7.0,<2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0,<2.3.0",
]

license = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff==0.14.6",
    "pre-commit>=3.0.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/intellistream/sage-rag-benchmark"
Documentation = "https://github.com/intellistream/sage-rag-benchmark#readme"
Repository = "https://github.com/intellistream/sage-rag-benchmark"
Issues = "https://github.com/intellistream/sage-rag-benchmark/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sage*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "sage.benchmark_rag._version.__version__"}

[tool.setuptools.package-data]
"sage.benchmark_rag" = [
    "config/*.yaml",
    "evaluation/config/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",
    "F401",
    "F403",
    "F405",
    "F841",
    "E712",
    "E402",
    "E741",
    "E722",
    "W293",
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
addopts = [
    "-ra",
    "--verbose",
]
